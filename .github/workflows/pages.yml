name: Deploy to GitHub Pages

# Production deploy: only the default branch, or a manual run. The site is
# rebuilt and tested here rather than published from a checkout, so whatever is
# live is what the current source produces.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run the test suite
        run: npm test
      - name: Build pages, cards and catalogue
        run: node src/build.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Collect the static site
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='export/' ./ "${RUNNER_TEMP}/site/"
          touch "${RUNNER_TEMP}/site/.nojekyll"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
